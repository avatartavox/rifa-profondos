<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="300" fill="#1a1a2e"/>

  <!-- Decorative gradient circle -->
  <defs>
    <radialGradient id="botoxGradient">
      <stop offset="0%" style="stop-color:#56E52A;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#56E52A;stop-opacity:0" />
    </radialGradient>
  </defs>
  <circle cx="200" cy="150" r="120" fill="url(#botoxGradient)"/>

  <!-- Syringe/Medical icon -->
  <g transform="translate(200, 150)">
    <!-- Syringe body -->
    <rect x="-25" y="-60" width="50" height="100" rx="8" fill="none" stroke="#56E52A" stroke-width="3"/>
    <!-- Needle -->
    <line x1="0" y1="-60" x2="0" y2="-85" stroke="#A020F0" stroke-width="2"/>
    <!-- Plunger -->
    <rect x="-28" y="30" width="56" height="12" rx="6" fill="#FF5722"/>
    <!-- Measurement lines -->
    <line x1="-22" y1="-40" x2="-16" y2="-40" stroke="#56E52A" stroke-width="2"/>
    <line x1="-22" y1="-20" x2="-16" y2="-20" stroke="#56E52A" stroke-width="2"/>
    <line x1="-22" y1="0" x2="-16" y2="0" stroke="#56E52A" stroke-width="2"/>
  </g>

  <!-- Text -->
  <text x="200" y="260" text-anchor="middle" font-size="18" font-weight="bold" fill="#56E52A" font-family="Arial">
    BOTOX
  </text>
  <text x="200" y="285" text-anchor="middle" font-size="12" fill="#A020F0" font-family="Arial">
    Tratamiento de belleza
  </text>
</svg>