<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="300" fill="#1a1a2e"/>

  <!-- Decorative gradient circle -->
  <defs>
    <radialGradient id="facialGradient">
      <stop offset="0%" style="stop-color:#A020F0;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#A020F0;stop-opacity:0" />
    </radialGradient>
  </defs>
  <circle cx="200" cy="150" r="120" fill="url(#facialGradient)"/>

  <!-- Face/Skincare icon -->
  <g transform="translate(200, 150)">
    <!-- Face outline -->
    <circle cx="0" cy="0" r="45" fill="none" stroke="#A020F0" stroke-width="2"/>

    <!-- Eyes -->
    <circle cx="-15" cy="-15" r="6" fill="none" stroke="#56E52A" stroke-width="2"/>
    <circle cx="15" cy="-15" r="6" fill="none" stroke="#56E52A" stroke-width="2"/>
    <circle cx="-15" cy="-15" r="3" fill="#56E52A"/>
    <circle cx="15" cy="-15" r="3" fill="#56E52A"/>

    <!-- Nose -->
    <line x1="0" y1="-8" x2="0" y2="8" stroke="#FF5722" stroke-width="2"/>

    <!-- Smile -->
    <path d="M -20 5 Q 0 20 20 5" fill="none" stroke="#A020F0" stroke-width="2" stroke-linecap="round"/>

    <!-- Skincare drops/bubbles -->
    <circle cx="-38" cy="-25" r="5" fill="#56E52A" opacity="0.7"/>
    <circle cx="38" cy="-25" r="5" fill="#56E52A" opacity="0.7"/>
    <circle cx="0" cy="-50" r="4" fill="#FF5722" opacity="0.8"/>

    <!-- Facial treatment glow -->
    <circle cx="0" cy="0" r="50" fill="none" stroke="#A020F0" stroke-width="1" opacity="0.3"/>
  </g>

  <!-- Text -->
  <text x="200" y="260" text-anchor="middle" font-size="18" font-weight="bold" fill="#A020F0" font-family="Arial">
    LIMPIEZA FACIAL
  </text>
  <text x="200" y="285" text-anchor="middle" font-size="12" fill="#56E52A" font-family="Arial">
    Tratamiento dermatológico
  </text>
</svg>