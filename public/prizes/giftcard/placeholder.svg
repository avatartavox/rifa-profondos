<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="300" fill="#1a1a2e"/>

  <!-- Decorative gradient circle -->
  <defs>
    <radialGradient id="giftcardGradient">
      <stop offset="0%" style="stop-color:#56E52A;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#56E52A;stop-opacity:0" />
    </radialGradient>
  </defs>
  <circle cx="200" cy="150" r="120" fill="url(#giftcardGradient)"/>

  <!-- Gift card icon -->
  <g transform="translate(200, 150)">
    <!-- Card body -->
    <rect x="-50" y="-35" width="100" height="70" rx="8" fill="none" stroke="#56E52A" stroke-width="3"/>

    <!-- Decorative stripe 1 -->
    <rect x="-50" y="-35" width="100" height="12" rx="8" fill="#56E52A" opacity="0.3"/>

    <!-- Ribbon bow -->
    <circle cx="0" cy="-30" r="12" fill="#A020F0"/>
    <ellipse cx="-15" cy="-30" rx="10" ry="14" fill="#A020F0" opacity="0.8"/>
    <ellipse cx="15" cy="-30" rx="10" ry="14" fill="#A020F0" opacity="0.8"/>

    <!-- Card details -->
    <rect x="-35" y="-20" width="70" height="8" rx="2" fill="#FF5722" opacity="0.5"/>

    <!-- Gift text/symbol -->
    <text x="0" y="15" text-anchor="middle" font-size="28" font-weight="bold" fill="#56E52A">🎁</text>

    <!-- Amount placeholder -->
    <text x="0" y="35" text-anchor="middle" font-size="12" fill="#A020F0" font-family="Arial">Tarjeta de regalo</text>
  </g>

  <!-- Text -->
  <text x="200" y="260" text-anchor="middle" font-size="18" font-weight="bold" fill="#56E52A" font-family="Arial">
    GIFTCARD
  </text>
  <text x="200" y="285" text-anchor="middle" font-size="12" fill="#A020F0" font-family="Arial">
    Tarjeta de compra
  </text>
</svg>