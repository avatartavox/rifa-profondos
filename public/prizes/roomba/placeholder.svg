<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="300" fill="#1a1a2e"/>

  <!-- Decorative gradient circle -->
  <defs>
    <radialGradient id="roombaGradient">
      <stop offset="0%" style="stop-color:#A020F0;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#A020F0;stop-opacity:0" />
    </radialGradient>
  </defs>
  <circle cx="200" cy="150" r="120" fill="url(#roombaGradient)"/>

  <!-- Robot vacuum icon -->
  <g transform="translate(200, 150)">
    <!-- Main body - circle -->
    <circle cx="0" cy="0" r="45" fill="none" stroke="#A020F0" stroke-width="3"/>
    <!-- Top sensor -->
    <circle cx="0" cy="-48" r="6" fill="#FF5722"/>
    <!-- Front bumper -->
    <rect x="-35" y="35" width="70" height="8" rx="4" fill="#56E52A"/>
    <!-- Side wheels -->
    <circle cx="-50" cy="5" r="8" fill="none" stroke="#A020F0" stroke-width="2"/>
    <circle cx="50" cy="5" r="8" fill="none" stroke="#A020F0" stroke-width="2"/>
    <!-- Center wheel indicators -->
    <line x1="-25" y1="45" x2="25" y2="45" stroke="#56E52A" stroke-width="2"/>
    <!-- Clean button -->
    <circle cx="0" cy="0" r="12" fill="#FF5722" opacity="0.7"/>
  </g>

  <!-- Text -->
  <text x="200" y="260" text-anchor="middle" font-size="18" font-weight="bold" fill="#A020F0" font-family="Arial">
    ROOMBA
  </text>
  <text x="200" y="285" text-anchor="middle" font-size="12" fill="#56E52A" font-family="Arial">
    Robot aspirador
  </text>
</svg>