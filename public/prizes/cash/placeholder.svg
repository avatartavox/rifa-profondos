<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="300" fill="#1a1a2e"/>

  <!-- Decorative gradient circle -->
  <defs>
    <radialGradient id="cashGradient">
      <stop offset="0%" style="stop-color:#FF5722;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#FF5722;stop-opacity:0" />
    </radialGradient>
  </defs>
  <circle cx="200" cy="150" r="120" fill="url(#cashGradient)"/>

  <!-- Money stack icon -->
  <g transform="translate(200, 130)">
    <!-- Stack of bills -->
    <rect x="-45" y="-40" width="90" height="15" rx="2" fill="#FF5722" stroke="#FFB74D" stroke-width="2"/>
    <rect x="-45" y="-20" width="90" height="15" rx="2" fill="#FF5722" stroke="#FFB74D" stroke-width="2" opacity="0.9"/>
    <rect x="-45" y="0" width="90" height="15" rx="2" fill="#FF5722" stroke="#FFB74D" stroke-width="2" opacity="0.8"/>
    <rect x="-45" y="20" width="90" height="15" rx="2" fill="#FF5722" stroke="#FFB74D" stroke-width="2" opacity="0.7"/>

    <!-- Dollar signs -->
    <text x="-25" y="-25" font-size="20" font-weight="bold" fill="#56E52A" font-family="Arial">$</text>
    <text x="0" y="-5" font-size="20" font-weight="bold" fill="#56E52A" font-family="Arial">$</text>
    <text x="25" y="15" font-size="20" font-weight="bold" fill="#56E52A" font-family="Arial">$</text>

    <!-- Wallet outline -->
    <path d="M -55 45 L 55 45 L 55 65 Q 55 70 50 70 L -50 70 Q -55 70 -55 65 Z" fill="none" stroke="#A020F0" stroke-width="2"/>
  </g>

  <!-- Text -->
  <text x="200" y="270" text-anchor="middle" font-size="18" font-weight="bold" fill="#FF5722" font-family="Arial">
    EFECTIVO
  </text>
  <text x="200" y="295" text-anchor="middle" font-size="12" fill="#56E52A" font-family="Arial">
    S/ 500 en dinero
  </text>
</svg>